version: 1

providers:
  - id: local_lmstudio
    type: local
    enabled: true
    engine: lmstudio
    model: auto
    purpose: "local_openai_compatible"

  - id: api_general
    type: api
    enabled: true
    engine: openai
    model: gpt-4.1-mini
    purpose: "general_reasoning"

routing_rules:
  - when:
      task_type: unsafe_scheduled_job
    use_provider: missing_provider
